[pytest]
# ==============================================================================
# TEST EXECUTION CONFIGURATION (Senior SDET Standard)
# ==============================================================================

# Minimal version of pytest required for stable feature support
minversion = 7.0

# Search for tests only in the 'tests' directory
testpaths = tests

# Ensure the source code is in the python path for all test types
pythonpath = src

# Default CLI options:
# -v: Verbose output for better visibility
# --strict-markers: Ensure all markers used are registered below
# -ra: Show summary of all except passed (failed, skipped, xfailed, etc.)
# --showlocals: Print local variables in tracebacks for easier debugging
addopts = -v --strict-markers -ra --showlocals

# ==============================================================================
# DISCOVERY CONFIGURATION
# ==============================================================================

# Custom markers to allow running subsets of tests (e.g., pytest -m unit)
markers =
    unit: Fast, isolated tests without external dependencies.
    integration: Tests involving database, filesystem, or network ports.
    e2e: Black-box system tests covering the full CLI or GUI flow.
    gui: Graphical environment required (manual or automated UI tests).

# File/Class/Function naming conventions for auto-discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Performance & Stability: Directories to completely skip during collection.
norecursedirs = .git .venv node_modules dist build __pycache__ tests/data

# ==============================================================================
# LOGGING CONFIGURATION
# ==============================================================================

# Capture and format logs during test execution for better diagnostics
log_level = INFO
log_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_date_format = %Y-%m-%d %H:%M:%S