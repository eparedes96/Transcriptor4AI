[pytest]
# ==============================================================================
# TEST EXECUTION CONFIGURATION
# ==============================================================================

# Minimal version of pytest required
minversion = 7.0

# Directory search patterns
testpaths = tests
pythonpath = src

# Default CLI options:
# -v: Verbose
# --strict-markers: Raise error on unregistered markers
# -ra: Show extra test summary info for all except passed
addopts = -v --strict-markers -ra --showlocals

# Custom markers definition
markers =
    unit: Fast, isolated tests.
    integration: I/O dependencies.
    e2e: Black-box system tests.
    gui: Graphical environment required.

# File discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Performance: ignore irrelevant directories
norecursedirs = .git .venv node_modules dist build __pycache__

# Logging configuration during tests
log_level = INFO
log_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_date_format = %Y-%m-%d %H:%M:%S